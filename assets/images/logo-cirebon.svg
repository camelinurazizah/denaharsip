<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <!-- Filter for soft glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Ring with Stars -->
  <circle cx="250" cy="250" r="236" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Curved Text Path -->
  <path id="topTextPath" d="M 60,250 A 190,190 0 0,1 440,250" fill="none"/>
  <text font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="16.5" font-weight="800" fill="#fef08a" letter-spacing="3.5">
    <textPath href="#topTextPath" startOffset="50%" text-anchor="middle">
      DINAS KEARSIPAN &amp; PERPUSTAKAAN
    </textPath>
  </text>

  <path id="bottomTextPath" d="M 440,250 A 190,190 0 0,1 60,250" fill="none"/>
  <text font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="4">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      KABUPATEN CIREBON
    </textPath>
  </text>

  <!-- Middle Inner Shield -->
  <g transform="translate(250, 245)">
    <!-- Pentagonal Shield of Kabupaten Cirebon -->
    <path d="M 0,-130 L 105,-80 L 80,65 L 0,120 L -80,65 L -105,-80 Z" 
          fill="#0c4a6e" stroke="url(#goldGrad)" stroke-width="5" filter="url(#shadow)"/>
    
    <!-- Inner Border of Shield -->
    <path d="M 0,-120 L 95,-75 L 72,55 L 0,108 L -72,55 L -95,-75 Z" 
          fill="#0369a1" fill-opacity="0.35" stroke="#fde047" stroke-width="1.5"/>

    <!-- Padi dan Kapas (Rice & Cotton stalks) flanking -->
    <!-- Left Rice Stalk -->
    <g fill="#eab308" stroke="#ca8a04" stroke-width="0.8">
      <path d="M -68,45 C -75,20 -78,-10 -65,-55" fill="none" stroke="#eab308" stroke-width="2.5"/>
      <ellipse cx="-72" cy="30" rx="4" ry="7" transform="rotate(-25 -72 30)"/>
      <ellipse cx="-76" cy="12" rx="4" ry="7" transform="rotate(-30 -76 12)"/>
      <ellipse cx="-77" cy="-7" rx="4" ry="7" transform="rotate(-35 -77 -7)"/>
      <ellipse cx="-74" cy="-26" rx="4" ry="7" transform="rotate(-40 -74 -26)"/>
      <ellipse cx="-67" cy="-44" rx="4" ry="7" transform="rotate(-45 -67 -44)"/>
    </g>

    <!-- Right Cotton/Rice Stalk -->
    <g fill="#22c55e" stroke="#15803d" stroke-width="0.8">
      <path d="M 68,45 C 75,20 78,-10 65,-55" fill="none" stroke="#eab308" stroke-width="2.5"/>
      <circle cx="72" cy="30" r="5" fill="#f8fafc" stroke="#15803d"/>
      <circle cx="76" cy="12" r="5" fill="#f8fafc" stroke="#15803d"/>
      <circle cx="77" cy="-7" r="5" fill="#f8fafc" stroke="#15803d"/>
      <circle cx="74" cy="-26" r="5" fill="#f8fafc" stroke="#15803d"/>
      <circle cx="67" cy="-44" r="5" fill="#f8fafc" stroke="#15803d"/>
    </g>

    <!-- Gapura Candi Bentar (Khas Keraton & Sejarah Cirebon / Sunan Gunung Jati) -->
    <!-- Left Gate Wing -->
    <path d="M -45,45 L -45,-30 L -38,-30 L -38,-42 L -30,-42 L -30,-55 L -22,-55 L -22,-68 L -14,-68 L -14,45 Z" 
          fill="url(#brickGrad)" stroke="#fef08a" stroke-width="1.2"/>
    <line x1="-45" y1="-10" x2="-14" y2="-10" stroke="#7f1d1d" stroke-width="1"/>
    <line x1="-45" y1="15" x2="-14" y2="15" stroke="#7f1d1d" stroke-width="1"/>
    <line x1="-45" y1="35" x2="-14" y2="35" stroke="#7f1d1d" stroke-width="1"/>

    <!-- Right Gate Wing -->
    <path d="M 45,45 L 45,-30 L 38,-30 L 38,-42 L 30,-42 L 30,-55 L 22,-55 L 22,-68 L 14,-68 L 14,45 Z" 
          fill="url(#brickGrad)" stroke="#fef08a" stroke-width="1.2"/>
    <line x1="45" y1="-10" x2="14" y2="-10" stroke="#7f1d1d" stroke-width="1"/>
    <line x1="45" y1="15" x2="14" y2="15" stroke="#7f1d1d" stroke-width="1"/>
    <line x1="45" y1="35" x2="14" y2="35" stroke="#7f1d1d" stroke-width="1"/>

    <!-- Keris in center (Lambang Pusaka Kebudayaan Cirebon) -->
    <path d="M 0,-70 Q 3,-50 0,-35 Q -3,-20 0,-5 L 0,25 L -2,25 L -2,32 L 2,32 L 2,25 Z" 
          fill="url(#goldGrad)" stroke="#78350f" stroke-width="1"/>
    <ellipse cx="0" cy="36" rx="4" ry="6" fill="#78350f"/>

    <!-- Bintang Emas Bersegi Lima (Ketuhanan & Kejayaan) -->
    <polygon points="0,-100 4,-90 14,-89 6,-81 9,-71 0,-76 -9,-71 -6,-81 -14,-89 -4,-90" 
             fill="url(#goldGrad)" stroke="#b45309" stroke-width="1" filter="url(#goldGlow)"/>

    <!-- Open Book & Archive Document Symbol (Lambang Disarpus) -->
    <g transform="translate(0, 50)">
      <!-- Book pages left & right -->
      <path d="M 0,0 Q -25,-12 -50,-5 L -50,22 Q -25,15 0,25 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <path d="M 0,0 Q 25,-12 50,-5 L 50,22 Q 25,15 0,25 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Book Spine -->
      <path d="M 0,0 L 0,25" stroke="#0284c7" stroke-width="3"/>
      <!-- Text lines on pages -->
      <line x1="-42" y1="3" x2="-8" y2="-3" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-42" y1="9" x2="-12" y2="4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-42" y1="15" x2="-8" y2="10" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="-3" x2="42" y2="3" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="12" y1="4" x2="42" y2="9" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="8" y1="10" x2="42" y2="15" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Motto Ribbon (Semboyan Kabupaten Cirebon) -->
    <g transform="translate(0, 92)">
      <path d="M -75,0 L -85,-8 L -75,-16 L 75,-16 L 85,-8 L 75,0 Z" 
            fill="url(#goldRibbon)" stroke="#b45309" stroke-width="1" filter="url(#shadow)"/>
      <text font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" 
            font-size="8.5" font-weight="900" fill="#78350f" text-anchor="middle" y="-5" letter-spacing="1.2">
        RAME ING GAWE SUCI ING PAMRIH
      </text>
    </g>
  </g>

  <!-- Little Decorative Elements -->
  <circle cx="70" cy="250" r="4" fill="url(#goldGrad)"/>
  <circle cx="430" cy="250" r="4" fill="url(#goldGrad)"/>
</svg>
